name: Create release artifacts

description: Publishes the app for each architecture, with an installer and a portable exe for each in the publish folder.

inputs:
  version:
    description: 'Version number for the app, such as 5.0.0'
    default: '0.0.0'
  archs:
    description: 'Architectures to build for'
    default: 'x64 arm64'

runs:
  using: "composite"
  steps:
    - uses: actions/setup-dotnet@v5

    # Only the app is published, so the test project's files stay out of the release folder.
    # The installer takes its version from the exe, so setting it here covers both.
    - name: Publish
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        for arch in ${{ inputs.archs }}; do
          dotnet publish "Network Monitor/Network Monitor.csproj" -c Release --os win --arch $arch -o "publish/$arch" -p:Version=$VERSION
        done

    # Each installer is built for its own architecture, so Windows refuses to install the Arm64 one on an x64 PC instead of installing an app that can't start.
    - name: Build installers
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        dotnet tool install --global wix --version 6.0.2
        for arch in ${{ inputs.archs }}; do
          wix build Product.wxs -arch $arch -d MainExeSource="publish/$arch/Network Monitor.exe" -o "publish/Network-Monitor-$VERSION-$arch.msi"
        done

    # The portable exes keep their names from one release to the next, so saving a new one over the old one keeps its settings and startup entry.
    - name: Name portable exes
      shell: bash
      run: |
        for arch in ${{ inputs.archs }}; do
          cp "publish/$arch/Network Monitor.exe" "publish/Network-Monitor-$arch.exe"
        done
